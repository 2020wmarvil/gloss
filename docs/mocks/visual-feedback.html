.col li.hov::marker { color: transparent; }
.col li.hov { background: var(--hover-soft, rgba(0,0,0,.02)); border-radius: var(--r-sm); box-shadow: -8px 0 0 var(--hover-soft, rgba(0,0,0,.02)), 8px 0 0 var(--hover-soft, rgba(0,0,0,.02)); }
.col li.hov .reply { display: inline-grid; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 var(--edge), var(--lift-1); color: var(--ink-2); }
.strip { max-width: 760px; width: 100%; margin: 0 auto 8px; padding: 0 32px; }
.strip > div { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 12px; border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 var(--edge), var(--lift-1); font-size: var(--t-13); }
.strip .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.composer-wrap { max-width: 760px; width: 100%; margin: 0 auto; padding: 0 32px; }
.composer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 7px; display: flex; align-items: center; gap: 6px; box-shadow: inset 0 1px 0 var(--edge), var(--lift-2); }
.composer.focus { border-color: var(--line-strong); box-shadow: inset 0 1px 0 var(--edge), var(--lift-2), 0 0 0 3px var(--focus); }
.composer .ed { flex: 1; min-width: 0; padding: 0 4px; color: var(--faint); font-size: var(--t-14); }
.composer .ed.typed { color: var(--ink); }
.status { max-width: 760px; width: 100%; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 6px 26px 10px; font-size: var(--t-12); color: var(--muted); }
/* The agent's items wrap onto a hidden second row: what doesn't fit disappears, right to left. */
.status .agent { flex: 1; min-width: 0; height: 24px; overflow: hidden; display: flex; flex-wrap: wrap; gap: 0 2px; }
.status .right { flex: none; display: flex; align-items: center; gap: 2px; }
.status .sb.shrink { max-width: 180px; overflow: hidden; }
.status .sb.shrink .tx { overflow: hidden; text-overflow: ellipsis; }
.status .sb { flex-shrink: 0; white-space: nowrap; height: 24px; padding: 0 6px; border-radius: var(--r-sm); display: inline-flex; align-items: center; gap: 5px; }
.status .sb .lb { color: var(--faint); }
.status .grow { flex: 1; }
.meter { width: 30px; height: 4px; border-radius: 2px; background: var(--line-strong); overflow: hidden; box-shadow: var(--sink); }
.meter i { display: block; height: 100%; width: 12%; background: var(--ink-2); }
.note-failed { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); background: var(--failed-tint); box-shadow: inset 0 0 0 1px var(--failed-line); font-size: var(--t-14); }
.note-failed .i { color: var(--failed); margin-top: 3px; }
.note-failed .t b { display: block; font-weight: 600; }
.note-failed .t span { color: var(--ink-2); font-size: var(--t-13); }
.note-failed .acts { display: flex; gap: 6px; margin-top: 10px; }

/* Side panel and rail */
.panel { flex: 0 0 400px; display: flex; flex-direction: column; background: var(--surface); background-image: var(--sheen); border-left: 1px solid var(--line); min-height: 0; position: relative; }
.panel .ph { height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 12px; border-bottom: 1px solid var(--line); }
.panel .ph .grow { flex: 1; }
.panel .ph .back { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border-radius: var(--r-sm); color: var(--ink-2); font-size: var(--t-13); font-weight: 500; }
.panel .quote { margin: 14px 18px 4px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: var(--t-13); }
.panel .msgs { flex: 1; padding: 10px 18px; font-size: var(--t-14); display: flex; flex-direction: column; gap: 12px; line-height: 1.55; overflow: hidden; }
.panel .msgs p { margin: 0; }
.panel .msgs .you { max-width: 88%; }
.panel .composer { margin: 0 14px 14px; }
.queued { border: 1px dashed var(--line-strong); border-radius: var(--r-md); padding: 6px 6px 6px 10px; display: flex; gap: 8px; align-items: center; font-size: 13px; background: var(--bg); }
.queued .grow { flex: 1; min-width: 0; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail { flex: 0 0 48px; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 4px; border-left: 1px solid var(--line); background: var(--bg); }
.rail .rb { position: relative; }
.rail .badge { position: absolute; right: -2px; top: -2px; }
.trows { padding: 8px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.thr { padding: 10px 10px 10px 12px; border-radius: var(--r-md); display: flex; flex-direction: column; gap: 4px; }
.thr.hov { background: var(--hover); }
.thr .q { font-size: var(--t-14); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.thr .q::before { content: ''; display: inline-block; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); margin-right: 8px; vertical-align: -1px; }
.thr .ctx { font-size: var(--t-12); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thr .meta { display: flex; gap: 10px; align-items: center; font-size: var(--t-12); color: var(--muted); }
.qgroup { padding: 10px 18px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.qrow { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: start; padding: 8px 10px; margin: 0 8px; border-radius: var(--r-md); font-size: var(--t-13); }
.qrow .w { font-size: var(--t-12); color: var(--faint); }
.qrow .tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qrow .dot { margin-top: 6px; }
.qrow.run { background: var(--working-tint); }
.qdiv { display: flex; align-items: center; gap: 8px; margin: 8px 18px; font-size: var(--t-12); color: var(--faint); }
.qdiv::before, .qdiv::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* Empty states (fix 30) */
.empty { flex: 1; display: grid; place-items: center; padding: 24px; }
.empty .in { width: 440px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
/* The bead beside the wordmark, its diameter a little larger than the type (docs/BRAND.md). */
.lockup { display: flex; align-items: center; gap: 12px; }
.lockup span { font: 600 44px/1 var(--font-ui); letter-spacing: -.02em; }
.lockup.project { gap: 10px; max-width: 100%; }
.lockup.project span { font-size: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: 4px; }
.empty h2 { margin: 6px 0 0; font-size: var(--t-24); font-weight: 600; letter-spacing: -.02em; }
.empty p { margin: 0; color: var(--muted); font-size: var(--t-14); }
.empty .card { width: 100%; text-align: left; margin-top: 14px; background: var(--surface); border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 var(--edge), var(--lift-1); padding: 6px; }
.empty .card .cap { padding: 8px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.hint-new { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; }
.hint-new .in { display: inline-flex; flex-direction: column; align-items: center; gap: 10px; max-width: 520px; }
.hint-new h3 { margin: 0; font-size: var(--t-20); font-weight: 600; letter-spacing: -.01em; }
.hint-new p { margin: 0; color: var(--muted); font-size: var(--t-14); }
.hint-new .tips { display: flex; gap: 8px; margin-top: 4px; }
.tip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 var(--edge), var(--lift-1); font-size: var(--t-13); color: var(--ink-2); }

/* Dialogs */
.scrim { position: absolute; inset: 0; z-index: 40; background: var(--scrim); display: flex; justify-content: center; }
.dialog { background: var(--raised); background-image: var(--sheen); border-radius: var(--r-lg); box-shadow: var(--shadow-3), inset 0 0 0 1px var(--line), inset 0 1px 0 var(--edge); }
.signin { width: 460px; align-self: center; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.signin h3 { margin: 0; font-size: var(--t-17); font-weight: 600; }
.signin p { margin: 0; color: var(--muted); font-size: var(--t-13); }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 var(--edge), var(--lift-1); }
.opt.hl { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px var(--focus); }
.opt .grow { flex: 1; }
.opt b { display: block; font-size: var(--t-14); font-weight: 600; }
.opt span { font-size: var(--t-12); color: var(--muted); }
.opt .i { margin-top: 2px; color: var(--muted); }
.search { width: 760px; margin-top: 32px; align-self: flex-start; display: flex; flex-direction: column; max-height: 680px; }
.search .sh { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.search .sh .row { display: flex; gap: 8px; align-items: center; }
.search .res { overflow: hidden; padding: 6px; }
.sgroup { padding: 10px 10px 4px; display: flex; align-items: baseline; gap: 8px; }
.sgroup b { font-size: var(--t-13); font-weight: 600; }
.sgroup span { font-size: var(--t-12); color: var(--faint); }
.sres { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 8px 10px; border-radius: var(--r-md); }
.sres.hl { background: var(--hover); box-shadow: inset 0 0 0 1px var(--line); }
.sres .i { color: var(--faint); margin-top: 2px; }
.sres .where { font-size: var(--t-12); color: var(--muted); }
.sres .snip { font-size: var(--t-14); line-height: 1.5; }
mark { background: var(--accent-tint); color: inherit; border-radius: 3px; padding: 0 1px; box-shadow: inset 0 -2px 0 var(--accent-mark); }
.search .sf { padding: 8px 14px; border-top: 1px solid var(--line); display: flex; gap: 14px; font-size: var(--t-12); color: var(--muted); align-items: center; }

/* Settings (fix 31) */
.settings { flex: 1; display: flex; min-width: 0; background-image: var(--sheen); }
.snav { flex: 0 0 210px; padding: 20px 12px; display: flex; flex-direction: column; gap: 1px; border-right: 1px solid var(--line); }
.snav .t { font-size: var(--t-17); font-weight: 600; padding: 0 10px 12px; }
.snav .it { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--r-md); font-size: var(--t-13); color: var(--ink-2); position: relative; }
.snav .it.cur { background: var(--surface); box-shadow: inset 0 1px 0 var(--edge), var(--lift-1), 0 0 0 1px var(--line); color: var(--ink); font-weight: 500; }
:root[data-theme='dark'] .snav .it.cur { background: var(--raised); }
.snav .it.cur::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--accent); }
.snav .it .i { color: var(--muted); }
.snav .sub { padding: 14px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.scontent { flex: 1; min-width: 0; overflow: hidden; padding: 20px 40px; }
.scontent .top2 { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-size: var(--t-12); color: var(--muted); }
.scontent .top2 .grow { flex: 1; }
.scontent h2 { margin: 0 0 4px; font-size: var(--t-20); font-weight: 600; letter-spacing: -.01em; }
.scontent .lede { margin: 0 0 14px; color: var(--muted); font-size: var(--t-13); }
.sgrp { background: var(--surface); border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 var(--edge), var(--lift-1); margin-bottom: 22px; }
.srow { display: flex; gap: 24px; align-items: center; padding: 14px 18px; }
.srow + .srow { border-top: 1px solid var(--line); }
.srow .l { flex: 1; min-width: 0; }
.srow .l b { display: block; font-size: var(--t-14); font-weight: 500; }
.srow .l span { font-size: var(--t-13); color: var(--muted); }
.sgh { font-size: var(--t-13); font-weight: 600; margin: 0 0 8px 2px; color: var(--ink-2); }

/* Review (fixes 25, 26) */
.rhead { flex: none; padding: 12px 20px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.rhead .r1 { display: flex; align-items: center; gap: 10px; }
.rhead .r1 .tt { font-weight: 600; font-size: var(--t-17); }
.rhead .r2 { display: flex; align-items: center; gap: 6px; font-size: var(--t-12); color: var(--muted); }
.rhead .r2 .grow { flex: 1; }
.rpick { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: var(--r-sm); background: linear-gradient(to bottom, var(--surface), var(--bg)); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 var(--edge), var(--lift-1); color: var(--ink-2); font-size: var(--t-12); }
:root[data-theme='dark'] .rpick { background: linear-gradient(to bottom, var(--raised), var(--surface)); }
.rpick .lb { color: var(--faint); }
.add { color: var(--done); } .del { color: var(--failed); }
.tools-r { display: inline-flex; gap: 2px; align-items: center; }
.vsep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.diff { flex: 1; overflow: hidden; font: 400 var(--t-12)/20px var(--font-mono); }
.fhead { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--edge); font: 500 var(--t-13)/1 var(--font-ui); }
.fhead .dir { color: var(--faint); font-weight: 400; }
.fhead .grow { flex: 1; }
.fhead .pill { font-size: var(--t-11); color: var(--muted); padding: 2px 6px; border-radius: var(--r-xs); background: var(--sunken); }
.hunk { display: flex; align-items: center; height: 26px; padding: 0 0 0 14px; background: var(--diff-hunk); color: var(--muted); border-bottom: 1px solid var(--line-soft); }
.hunk .grow { flex: 1; }
/* The app's expander (DiffView): two stacked half-height buttons for 10 more lines up or
   down, and one beside them for the whole gap. */
.xp { flex: none; display: inline-flex; height: 26px; border: 1px solid var(--line-strong); background: var(--surface); box-shadow: inset 0 1px 0 var(--edge); }
.xp .pair { display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.xp .pair span { flex: 1; width: 28px; display: grid; place-items: center; color: var(--muted); }
.xp .pair span:first-child { border-bottom: 1px solid var(--line); }
.xp .pair .i { width: 13px; height: 13px; }
.xp .all { width: 32px; display: grid; place-items: center; color: var(--muted); }
.dl { display: grid; grid-template-columns: 44px 16px 1fr 44px 16px 1fr; }
.dl > span { white-space: pre; overflow: hidden; padding-right: 8px; }
.dl .n { text-align: right; padding-right: 8px; color: var(--faint); }
.dl .m { color: var(--faint); }
.dl .a { background: var(--diff-add); } .dl .ag { background: var(--diff-add-gutter); }
.dl .d { background: var(--diff-del); } .dl .dg { background: var(--diff-del-gutter); }
.dl .e { background: var(--sunken); opacity: .55; }
.gm { position: relative; }
.gm::after { content: ''; position: absolute; left: 4px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--failed); }
.gm.sugg::after { background: var(--working); }
.fcard-row { display: grid; grid-template-columns: 1fr 1fr; }
.fcard { grid-column: 2; margin: 2px 12px 8px 60px; padding: 10px 12px; font: 400 var(--t-13)/1.5 var(--font-ui); border-left: 3px solid var(--failed); background: var(--surface); border-radius: 0 var(--r-sm) var(--r-sm) 0; box-shadow: inset 0 0 0 1px var(--line); }
.fcard .t { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.fcard .t .grow { flex: 1; }
.fcard .b { color: var(--ink-2); margin-top: 4px; }
.fcard .m { color: var(--faint); font-size: var(--t-12); margin-top: 6px; }
.band { flex: none; border-top: 1px solid var(--line); background: var(--surface); }
.band .status { max-width: none; padding: 4px 14px; }
.gcard { margin: 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--bg); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 var(--edge), var(--lift-1); }
.gcard .t { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: var(--t-13); }
.gcard p { margin: 4px 0 0; color: var(--ink-2); font-size: var(--t-13); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.filters { display: flex; gap: 6px; align-items: center; padding: 0 12px 8px; }
.filters .grow { flex: 1; }
.fgrp { padding: 10px 14px 2px; font-size: var(--t-12); font-weight: 600; color: var(--ink-2); }
.fgrp .dir { color: var(--faint); font-weight: 400; }
.rrow { display: grid; grid-template-columns: 10px 1fr; gap: 10px; padding: 8px 10px; margin: 0 6px; border-radius: var(--r-md); font-size: var(--t-13); }
.rrow.cur { background: var(--hover); }
.rrow .dot { margin-top: 6px; }
.rrow .meta { font-size: var(--t-12); color: var(--muted); display: flex; gap: 8px; }
.rrow .ln { color: var(--faint); font-variant-numeric: tabular-nums; }

/* ================= M16: visual feedback ================= */
.notes kbd { color: #1c1b18; background: #f7f6f2; box-shadow: inset 0 0 0 1px #d3d0c6, 0 1px 0 #d3d0c6; }

/* The capture button sits beside Attach; disabled when the agent can't take images. */
.composer .icon-btn.cap-on { background: var(--hover); color: var(--ink); }
.composer .icon-btn:disabled { opacity: .4; cursor: default; background: transparent; }
.tip-pop { position: absolute; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; border-radius: var(--r-md); background: var(--raised); box-shadow: var(--shadow-2), inset 0 0 0 1px var(--line), inset 0 1px 0 var(--edge); font-size: var(--t-12); color: var(--ink-2); white-space: nowrap; }
.tip-pop.off { color: var(--muted); }
.composer.stack { flex-direction: column; align-items: stretch; gap: 8px; }
.composer.stack .crow { display: flex; align-items: center; gap: 6px; }

/* A capture in the composer: the flattened image, its pin count, and Edit. */
.capchip { position: relative; display: inline-flex; align-self: flex-start; border-radius: var(--r-sm); box-shadow: inset 0 0 0 1px var(--line); background: var(--sunken); cursor: pointer; }
.capchip img { display: block; height: 72px; border-radius: var(--r-sm); }
.capchip .pinpill { position: absolute; left: 4px; bottom: 4px; display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px 0 4px; border-radius: var(--r-pill); background: #e0157f; color: #fff; font: 600 var(--t-11)/1 var(--font-ui); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.capchip .pinpill .i { width: 11px; height: 11px; }
.capchip .x { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; display: grid; place-items: center; border-radius: var(--r-xs); background: rgba(255,255,255,.85); color: #3a3833; }
.capchip .edit { position: absolute; inset: 0; display: none; place-items: center; border-radius: var(--r-sm); background: rgba(28,27,24,.45); color: #fff; font: 500 var(--t-12)/1 var(--font-ui); }
.capchip:hover .edit { display: grid; }
.capchip .edit span { display: inline-flex; gap: 5px; align-items: center; }

/* ---- The region overlay: a frozen copy of one display, ShareX-style ---- */
.monitor { width: 1280px; height: 800px; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.4); cursor: crosshair; user-select: none; }
.monitor canvas { position: absolute; inset: 0; display: block; }
.hintpill { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; padding: 7px 14px; border-radius: var(--r-pill); background: rgba(20, 19, 18, .82); color: #efeee9; font: 500 12px/1 var(--font-ui); pointer-events: none; transition: opacity .3s; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
.hintpill kbd { background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); color: #efeee9; height: 18px; }
.hintpill.gone { opacity: 0; }

/* ---- The annotation dialog ---- */
.ann { width: 1200px; height: 716px; align-self: center; display: grid; grid-template-rows: 52px minmax(0, 1fr) 58px; grid-template-columns: minmax(0, 1fr) 300px; overflow: hidden; }
.ann .ah { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 18px; border-bottom: 1px solid var(--line); }
.ann .ah b { font-size: var(--t-15); font-weight: 600; }
.ann .ah .meta { font-size: var(--t-12); color: var(--muted); }
.ann .ah .grow { flex: 1; }
.tbx { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: var(--r-md); background: var(--sunken); box-shadow: var(--sink); }
.tbx .icon-btn { width: 30px; height: 28px; border-radius: var(--r-sm); position: relative; }
.tbx .icon-btn.on { background: var(--surface); color: var(--ink); box-shadow: inset 0 1px 0 var(--edge), var(--lift-1); }
:root[data-theme='dark'] .tbx .icon-btn.on { background: var(--raised); }
.tbx .icon-btn:disabled { opacity: .35; cursor: default; }
.tbx .icon-btn:disabled:hover { background: transparent; }
.tbx .vsep { height: 16px; }
.sw { width: 26px; height: 28px; display: grid; place-items: center; border: 0; background: transparent; border-radius: var(--r-sm); cursor: pointer; }
.sw i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(128,128,128,.55); }
.sw.on i { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-2); }
.astage { grid-column: 1; grid-row: 2; display: grid; place-items: center; padding: 20px; background-color: var(--sunken); background-image: linear-gradient(45deg, var(--line-soft) 25%, transparent 25%, transparent 75%, var(--line-soft) 75%), linear-gradient(45deg, var(--line-soft) 25%, transparent 25%, transparent 75%, var(--line-soft) 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; box-shadow: var(--sink); min-height: 0; }
.astage canvas { display: block; box-shadow: 0 0 0 1px var(--line-strong), var(--shadow-2); cursor: crosshair; }
.astage canvas.pin-tool { cursor: copy; }
.astage canvas.grab { cursor: grabbing; }
.apins { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--surface); }
.apins .aph { display: flex; align-items: center; gap: 8px; padding: 12px 14px 6px; font-size: var(--t-13); font-weight: 600; }
.alist { flex: 1; overflow: auto; padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; }
.prow { display: grid; grid-template-columns: 22px 1fr 24px; gap: 8px; align-items: start; padding: 6px; border-radius: var(--r-md); }
.prow.hl { background: var(--hover); }
.pnum { width: 22px; height: 22px; border-radius: 50%; background: #e0157f; color: #fff; display: grid; place-items: center; font: 700 11px/1 var(--font-ui); box-shadow: 0 0 0 1.5px #fff, 0 1px 3px rgba(0,0,0,.3); flex: none; }
.prow textarea { width: 100%; min-height: 32px; resize: none; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); font: 400 var(--t-13)/1.4 var(--font-ui); box-shadow: var(--sink); field-sizing: content; }
.prow textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
.aempty { margin: 6px 8px; padding: 12px; border-radius: var(--r-md); border: 1px dashed var(--line-strong); color: var(--muted); font-size: var(--t-13); line-height: 1.5; }
.asend { border-top: 1px solid var(--line); padding: 10px 14px 12px; background: var(--bg); }
.asend .cap { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }

.ann .af { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 18px; border-top: 1px solid var(--line); }
.ann .af .hint { font-size: var(--t-12); color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.ann .af .grow { flex: 1; }
.btn.primary kbd { background: rgba(255,255,255,.35); box-shadow: none; color: var(--on-brand); height: 18px; }

/* ---- A sent capture: pins are anchors ---- */
.you.has-cap { max-width: 520px; display: flex; flex-direction: column; gap: 10px; }
.capfig { position: relative; margin: 0; border-radius: var(--r-md); overflow: visible; }
.capfig img { display: block; border-radius: var(--r-md); box-shadow: 0 0 0 1px var(--you-ring), var(--lift-1); cursor: zoom-in; }
.pinhit { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; border: 0; padding: 0; background: transparent; cursor: pointer; }
.pinhit:hover, .pinhit.cur { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent); }
.pinhit .reply-count { position: absolute; left: calc(100% + 4px); top: 50%; transform: translateY(-50%); margin: 0; box-shadow: 0 0 0 1px var(--surface), var(--lift-1); }

.pinhit:hover .ptip { display: block; }

.pinnotes .pnum { width: 18px; height: 18px; font-size: 10px; margin-top: 2px; box-shadow: none; }
.pinnotes .nt { flex: 1; }
.pinnotes .nt.empty { color: var(--muted); font-style: italic; }
.pinref { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: #e0157f; color: #fff; font: 700 10px/1 var(--font-ui); vertical-align: 1px; margin-right: 4px; cursor: pointer; }
.pinref:hover { box-shadow: 0 0 0 3px var(--focus); }
.pinquote { margin: 14px 18px 4px; display: flex; gap: 10px; align-items: center; padding: 8px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: var(--t-13); }
.pinquote img { width: 120px; height: 72px; object-fit: cover; border-radius: var(--r-xs); box-shadow: 0 0 0 1px var(--line); flex: none; }

.sent-log { overflow: auto !important; }
.pinquote .pt span { color: var(--muted); font-size: var(--t-12); }
.thr .q .pnum { display: inline-grid; width: 16px; height: 16px; font-size: 9px; vertical-align: 1px; margin-right: 4px; box-shadow: none; }
.lightbox { position: absolute; inset: 0; z-index: 45; background: rgba(12, 11, 10, .82); display: grid; place-items: center; }
.lightbox .capfig img { cursor: default; box-shadow: var(--shadow-3); }
.lightbox .lbx { position: absolute; top: 12px; right: 12px; color: #fff; }
.lightbox .lbx:hover { background: rgba(255,255,255,.12); color: #fff; }
.lightbox .lbcap { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.7); font-size: var(--t-12); }

/* ================= Annotation drawing (also used to flatten) ================= */
function drawShape(c, s, r) {
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = s.color; c.lineWidth = Math.max(3, Math.round(r * .26))
  if (s.type === 'pen' || s.type === 'hl') {
    if (s.type === 'hl') { c.globalCompositeOperation = 'multiply'; c.globalAlpha = .4; c.lineWidth = r * 1.5; c.lineCap = 'butt' }
    c.beginPath(); s.pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke()
  } else if (s.type === 'box') {
    c.strokeRect(Math.min(s.x1, s.x2), Math.min(s.y1, s.y2), Math.abs(s.x2 - s.x1), Math.abs(s.y2 - s.y1))
  } else if (s.type === 'arrow') {
    const a = Math.atan2(s.y2 - s.y1, s.x2 - s.x1), h = r * 1.2
    c.beginPath(); c.moveTo(s.x1, s.y1); c.lineTo(s.x2, s.y2); c.stroke()
    c.beginPath(); c.moveTo(s.x2, s.y2); c.lineTo(s.x2 - h * Math.cos(a - .45), s.y2 - h * Math.sin(a - .45)); c.moveTo(s.x2, s.y2); c.lineTo(s.x2 - h * Math.cos(a + .45), s.y2 - h * Math.sin(a + .45)); c.stroke()
  }
  c.restore()
}
function drawPin(c, p, n, r, hl) {
  c.save()
  if (hl) { c.beginPath(); c.arc(p.x, p.y, r + 6, 0, Math.PI * 2); c.fillStyle = 'rgba(224,21,127,.25)'; c.fill() }
  c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 4; c.shadowOffsetY = 1
  c.beginPath(); c.arc(p.x, p.y, r, 0, Math.PI * 2); c.fillStyle = PIN; c.fill()
  c.shadowColor = 'transparent'; c.lineWidth = Math.max(2, r * .16); c.strokeStyle = '#fff'; c.stroke()
  c.fillStyle = '#fff'; c.font = F(700, Math.round(r * 1.05)); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(n), p.x, p.y + 1)
  c.restore()
}
function flatten(src, shapes, pins, hlIndex = -1) {
  const k = document.createElement('canvas'); k.width = src.width; k.height = src.height
  const c = k.getContext('2d'), r = pinR(k.width, k.height)
  c.drawImage(src, 0, 0); shapes.forEach((s) => drawShape(c, s, r)); pins.forEach((p, i) => drawPin(c, p, i + 1, r, i === hlIndex))
  return k
}

/* ---------------- Region overlay ---------------- */
let raf = 0
function mountRegion() {
  document.getElementById('deskc').getContext('2d').drawImage(desk, 0, 0)
  const ov = document.getElementById('ov'), c = ov.getContext('2d'), hint = document.getElementById('hint')
  const st = { x: DW / 2, y: DH / 2, down: null, drag: false, shift: false, ant: 0 }
  const hover = () => WINDOWS.find((w) => st.x >= w.r.x && st.x < w.r.x + w.r.w && st.y >= w.r.y && st.y < w.r.y + w.r.h) ?? { name: 'Display', r: { x: 0, y: 0, w: DW, h: DH } }
  const selRect = () => {
    let w = Math.abs(st.x - st.down.x) + 1, h = Math.abs(st.y - st.down.y) + 1
    if (st.shift) { w = h = Math.max(w, h) }
    return { x: st.x < st.down.x ? st.down.x - w + 1 : st.down.x, y: st.y < st.down.y ? st.down.y - h + 1 : st.down.y, w, h }
  }
  const label = (s, x, y) => { c.font = F(500, 12); const w = c.measureText(s).width + 14; c.fillStyle = 'rgba(20,19,18,.82)'; c.beginPath(); c.roundRect(x, y, w, 22, 5); c.fill(); c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(s, x + 7, y + 11.5); return w }
  function frame() {
    st.ant = (st.ant + .5) % 10
    const a = st.drag ? selRect() : hover().r
    c.clearRect(0, 0, DW, DH)
    c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.rect(0, 0, DW, DH); c.rect(a.x, a.y, a.w, a.h); c.fill('evenodd')
    c.save(); c.translate(.5, .5); c.lineWidth = 1
    c.strokeStyle = '#ff3da6'; c.strokeRect(a.x, a.y, a.w - 1, a.h - 1)
    c.strokeStyle = 'rgba(0,0,0,.9)'; c.setLineDash([5, 5]); c.lineDashOffset = -st.ant; c.strokeRect(a.x, a.y, a.w - 1, a.h - 1); c.restore()
    if (st.drag) {
      const cx = Math.floor(a.x + a.w / 2), cy = Math.floor(a.y + a.h / 2)
      c.fillStyle = '#000'; c.fillRect(cx - 5, cy - 1, 11, 3); c.fillRect(cx - 1, cy - 5, 3, 11); c.fillStyle = '#ff3da6'; c.fillRect(cx - 4, cy, 9, 1); c.fillRect(cx, cy - 4, 1, 9)
      label(`${a.w} × ${a.h}`, a.x, a.y >= 28 ? a.y - 28 : a.y + 6)
    }
    // Magnifier: 15 × 15 px at 10×, beside the cursor, flipped at the edges.
    const M = 150, off = 24
    let mx = st.x + off, my = st.y + off
    if (mx + M > DW) mx = st.x - off - M
    if (my + M + 30 > DH) my = st.y - off - M - 30
    c.save(); c.beginPath(); c.arc(mx + M / 2, my + M / 2, M / 2, 0, Math.PI * 2); c.clip()
    c.imageSmoothingEnabled = false; c.fillStyle = '#000'; c.fillRect(mx, my, M, M); c.drawImage(desk, st.x - 7, st.y - 7, 15, 15, mx, my, M, M)
    c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 1; c.beginPath()
    for (let i = 1; i < 15; i++) { c.moveTo(mx + i * 10 + .5, my); c.lineTo(mx + i * 10 + .5, my + M); c.moveTo(mx, my + i * 10 + .5); c.lineTo(mx + M, my + i * 10 + .5) }
    c.stroke(); c.strokeStyle = '#000'; c.strokeRect(mx + 70 + .5, my + 70 + .5, 10, 10); c.strokeStyle = '#fff'; c.strokeRect(mx + 71 + .5, my + 71 + .5, 8, 8); c.restore()
    c.beginPath(); c.arc(mx + M / 2, my + M / 2, M / 2, 0, Math.PI * 2); c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.85)'; c.stroke()
    const s = `X: ${st.x}  Y: ${st.y}`; c.font = F(500, 12); label(s, mx + M / 2 - (c.measureText(s).width + 14) / 2, my + M + 6)
    raf = requestAnimationFrame(frame)
  }
  const pos = (e) => { const b = ov.getBoundingClientRect(); st.x = Math.max(0, Math.min(DW - 1, Math.floor(e.clientX - b.left))); st.y = Math.max(0, Math.min(DH - 1, Math.floor(e.clientY - b.top))) }
  ov.onmousemove = (e) => { pos(e); st.shift = e.shiftKey; if (st.down && !st.drag && Math.hypot(st.x - st.down.x, st.y - st.down.y) >= 3) { st.drag = true; hint.classList.add('gone') } }
  ov.onmousedown = (e) => {
    pos(e)
    if (e.button === 0) { st.down = { x: st.x, y: st.y }; st.drag = false }
    if (e.button === 2) { if (st.drag) { st.drag = false; st.down = null } else show('entry') }
  }
  ov.onmouseup = (e) => {
    if (e.button !== 0 || !st.down) return
    pos(e)
    if (st.drag) { const r = selRect(); st.drag = false; st.down = null; if (r.w >= 5 && r.h >= 5) capture(r, 'Region'); return }
    st.down = null; const w = hover(); capture(w.r, w.name === 'Display' ? 'Display' : `Window: ${w.name}`)
  }
  ov.oncontextmenu = (e) => e.preventDefault()
  KEYS = (e) => {
    st.shift = e.shiftKey
    if (e.key === 'Escape') show('entry')
    else if (e.key === ' ') { e.preventDefault(); capture({ x: 0, y: 0, w: DW, h: DH }, 'Display') }
  }
  frame()
}
function capture(r, source) {
  const x = Math.max(0, r.x), y = Math.max(0, r.y), w = Math.min(DW, r.x + r.w) - x, h = Math.min(DH, r.y + r.h) - y
  S.capture = { canvas: crop({ x, y, w, h }), w, h, source }
  S.shapes = []; S.pins = []; S.past = []; S.future = []; S.flat = null; S.seeded = false
  show('annotate')
}

/* ---------------- Annotation canvas ---------------- */
function mountAnnotate() {
  const cv = document.getElementById('ann'), stage = document.getElementById('astage'), cap = S.capture
  cv.width = cap.w; cv.height = cap.h
  const scale = Math.min(1, (stage.clientWidth - 40) / cap.w, (stage.clientHeight - 40) / cap.h)
  cv.style.width = `${cap.w * scale}px`; cv.style.height = `${cap.h * scale}px`
  const c = cv.getContext('2d'), r = pinR(cap.w, cap.h)
  let hl = -1, live = null, dragPin = null
  const snap = () => { S.past.push(JSON.stringify({ shapes: S.shapes, pins: S.pins })); S.future = [] }
  const restore = (j) => { const o = JSON.parse(j); S.shapes = o.shapes; S.pins = o.pins }
  const now = () => JSON.stringify({ shapes: S.shapes, pins: S.pins })
  function paint() {
    c.clearRect(0, 0, cv.width, cv.height); c.drawImage(cap.canvas, 0, 0)
    S.shapes.forEach((s) => drawShape(c, s, r)); if (live) drawShape(c, live, r)
    S.pins.forEach((p, i) => drawPin(c, p, i + 1, r, i === hl))
    document.getElementById('undo').disabled = !S.past.length; document.getElementById('redo').disabled = !S.future.length
  }
  function list(focus = -1) {
    document.getElementById('pcount').textContent = S.pins.length
    const el = document.getElementById('alist')
    el.innerHTML = S.pins.length ? S.pins.map((p, i) => `<div class="prow" data-i="${i}"><span class="pnum">${i + 1}</span><textarea rows="1" placeholder="What about it?">${esc(p.note)}</textarea><button class="icon-btn sm" title="Delete pin">${ic('trash-2', 's14')}</button></div>`).join('')
      : `<div class="aempty">Choose <b>Pin</b> (<kbd>N</kbd>) and click the image. Each pin gets a number and a note, and the agent can refer to it by number.</div>`
    el.querySelectorAll('.prow').forEach((row) => {
      const i = +row.dataset.i
      row.onmouseenter = () => { hl = i; row.classList.add('hl'); paint() }
      row.onmouseleave = () => { hl = -1; row.classList.remove('hl'); paint() }
      row.querySelector('textarea').oninput = (e) => { S.pins[i].note = e.target.value; text() }
      row.querySelector('button').onclick = () => { snap(); S.pins.splice(i, 1); hl = -1; list(); paint() }
    })
    if (focus >= 0) el.querySelectorAll('textarea')[focus]?.focus()
    text()
  }
  const text = () => { document.getElementById('atext').textContent = pinText(S.pins) }
  function setTool(t) { S.tool = t; document.querySelectorAll('#tools [data-tool]').forEach((b) => b.classList.toggle('on', b.dataset.tool === t)); cv.classList.toggle('pin-tool', t === 'pin') }
  function setColor(col) { S.color = col; document.querySelectorAll('#tools .sw').forEach((b) => b.classList.toggle('on', b.dataset.color === col)) }
  const pt = (e) => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / scale, (e.clientY - b.top) / scale] }
  const hitPin = (x, y) => { for (let i = S.pins.length - 1; i >= 0; i--) if (Math.hypot(S.pins[i].x - x, S.pins[i].y - y) <= r + 3) return i; return -1 }
  cv.onpointerdown = (e) => {
    cv.setPointerCapture(e.pointerId); const [x, y] = pt(e)
    if (S.tool === 'pin') {
      const i = hitPin(x, y)
      if (i >= 0) { dragPin = { i, before: now(), dx: S.pins[i].x - x, dy: S.pins[i].y - y }; cv.classList.add('grab'); return }
      snap(); S.pins.push({ x, y, note: '' }); paint(); list(S.pins.length - 1); return
    }
    live = S.tool === 'pen' || S.tool === 'hl' ? { type: S.tool, color: S.color, pts: [[x, y]] } : { type: S.tool, color: S.color, x1: x, y1: y, x2: x, y2: y }
  }
  cv.onpointermove = (e) => {
    const [x, y] = pt(e)
    if (dragPin) { S.pins[dragPin.i].x = x + dragPin.dx; S.pins[dragPin.i].y = y + dragPin.dy; paint(); return }
    if (!live) return
    if (live.pts) live.pts.push([x, y]); else { live.x2 = x; live.y2 = y }
    paint()
  }
  cv.onpointerup = () => {
    if (dragPin) { if (dragPin.before !== now()) { S.past.push(dragPin.before); S.future = [] } dragPin = null; cv.classList.remove('grab'); return }
    if (!live) return
    const tiny = live.pts ? live.pts.length < 2 : Math.hypot(live.x2 - live.x1, live.y2 - live.y1) < 4
    if (!tiny) { snap(); S.shapes.push(live) }
    live = null; paint()
  }
  const undo = () => { if (!S.past.length) return; S.future.push(now()); restore(S.past.pop()); list(); paint() }
  const redo = () => { if (!S.future.length) return; S.past.push(now()); restore(S.future.pop()); list(); paint() }
  const add = () => { finish(); show('composer') }
  document.getElementById('undo').onclick = undo; document.getElementById('redo').onclick = redo
  document.querySelectorAll('#tools [data-tool]').forEach((b) => { b.onclick = () => setTool(b.dataset.tool) })
  document.querySelectorAll('#tools .sw').forEach((b) => { b.onclick = () => setColor(b.dataset.color) })
  document.getElementById('retake').onclick = () => show('region')
  document.getElementById('annX').onclick = document.getElementById('annCancel').onclick = () => show('entry')
  document.getElementById('annAdd').onclick = add
  KEYS = (e) => {
    const mod = e.ctrlKey || e.metaKey, typing = e.target.tagName === 'TEXTAREA'
    if (mod && e.key === 'Enter') { e.preventDefault(); add(); return }
    if (mod && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return }
    if (mod && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return }
    if (e.key === 'Escape') { if (typing) e.target.blur(); else show('entry'); return }
    if (typing || mod) return
    const t = { n: 'pin', f: 'pen', h: 'hl', r: 'box', a: 'arrow' }[e.key.toLowerCase()]
    if (t) setTool(t)
  }
  setTool(S.tool); setColor(S.color); list(); paint()
}

function pinCrop(p) {

    ? `<p>Three fixes, one per pin:</p><ol>
        <li>${ref(1)}The legend is absolutely positioned at the chart's top right, over the plot. I moved it above the plot area.</li>
        <li>${ref(2)}<code class="inl">.btn + .btn</code> adds <code class="inl">margin-top: 4px</code>, so Export sits lower than Filter. Removed.</li>
        <li>${ref(3)}The Entries value had its own <code class="inl">line-height: 1.6</code>; it now uses the card's.</li></ol>`
    : `<p>Going through your pins:</p><ol>${pins.map((p) => `<li>${ref(p.n)}${esc(p.note.trim() || 'No note')}: found in <code class="inl">src/dashboard</code> and fixed.</li>`).join('')}</ol>`
  return `${sidebar()}<div class="sheet"><div class="main">${mainHead('Dashboard polish')}
    <div class="log sent-log"><div class="col">
      <div class="you has-cap"><span>These look off on the dashboard. Can you fix them?</span>${figure(440, 290)}
        <ol class="pinnotes">${pins.map((p) => `<li data-pin="${p.n}"><span class="pnum">${p.n}</span><span class="nt${p.note.trim() ? '' : ' empty'}">${esc(p.note.trim() || 'No note')}</span>${S.seeded && p.n === 2 ? `<span class="reply-count">${ic('message-square', 's12')}3</span>` : ''}</li>`).join('')}</ol></div>
      <div class="tools"><div class="trow">${ic('pencil')}<span class="title">Edit <code>src/dashboard/Chart.tsx</code></span><span class="s-done" style="display:inline-grid">${ic('check', 's14')}</span></div><div class="trow">${ic('pencil')}<span class="title">Edit <code>src/dashboard/Toolbar.css</code></span><span class="s-done" style="display:inline-grid">${ic('check', 's14')}</span></div></div>
      ${answer}
    </div></div>
    <div class="composer-wrap">${composerLine(capBtn())}</div>${statusLine()}
  </div>
  <aside class="panel"><div class="ph"><span class="back">${ic('arrow-left', 's14')}All threads</span><span class="grow"></span><button class="icon-btn sm" title="Find in main session">${ic('locate')}</button><button class="icon-btn sm" title="Hide panel">${ic('panel-right')}</button></div>
    ${open ? `<div class="pinquote"><img src="${pinCrop(open)}" alt=""><div class="pt"><b><span class="pnum">${open.n}</span>${esc(open.note.trim() || 'No note')}</b><span>Pin ${open.n} in your screenshot</span></div></div>` : ''}
    <div class="msgs">${S.seeded && open?.n === 2 ? SEEDED_THREAD : ''}</div>
    ${composer({ btn: 'send', ph: open ? `Reply about pin ${open.n}` : 'Reply in thread' })}
  </aside></div>${S.lightbox ? `<div class="lightbox" id="lb"><button class="icon-btn lbx" id="lbx">${ic('x')}</button>${figure(1160, 640)}<div class="lbcap">Click a pin to open its thread · Esc to close</div></div>` : ''}`
}
function mountSent() {
  document.querySelectorAll('[data-pin]').forEach((el) => { el.onclick = (e) => { e.stopPropagation(); S.openPin = +el.dataset.pin; S.lightbox = false; show('sent') } })
  document.querySelector('.col .capfig img').onclick = () => { S.lightbox = true; show('sent') }
  const lb = document.getElementById('lb')
  if (lb) { lb.onclick = (e) => { if (e.target === lb || e.target.closest('#lbx')) { S.lightbox = false; show('sent') } } }
  KEYS = (e) => { if (e.key === 'Escape' && S.lightbox) { S.lightbox = false; show('sent') } }
}

/* ================= Page ================= */
let KEYS = null
const root = document.documentElement, stage = document.getElementById('stage'), screenPick = document.getElementById('screenPick')
function show(id) {
  cancelAnimationFrame(raf); KEYS = null
  const s = SCREENS.find((x) => x.id === id) ?? SCREENS[0]
  stage.innerHTML = s.bare ? s.render() : `<div class="win">${titleBar()}<div class="body">${s.render()}</div></div>`
  document.getElementById('notes').innerHTML = s.notes
  for (const b of screenPick.children) b.setAttribute('aria-pressed', String(b.dataset.v === s.id))
  history.replaceState(null, '', `#${s.id}`)
  s.mount?.()
}
document.addEventListener('keydown', (e) => {
  if (KEYS) KEYS(e)
  const mod = e.ctrlKey || e.metaKey
  if (mod && e.shiftKey && e.key.toLowerCase() === 's' && ['entry', 'composer', 'sent'].includes(location.hash.slice(1))) { e.preventDefault(); show('region') }
})
document.addEventListener('keyup', (e) => { if (KEYS && e.key === 'Shift') KEYS(e) })
screenPick.innerHTML = SCREENS.map((s) => `<button data-v="${s.id}">${s.name}</button>`).join('')
screenPick.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.v) })
const themePick = document.getElementById('themePick')
themePick.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  root.dataset.theme = b.dataset.v
  for (const x of themePick.children) x.setAttribute('aria-pressed', String(x === b))
  show(location.hash.slice(1))
})
Promise.all([document.fonts.load(F(600, 14)), document.fonts.load(F(700, 14))]).catch(() => {}).finally(() => { drawDesk(); show(location.hash.slice(1)) })
</script>
</body>
</html>
