<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock – side panel: threads overview, thread, plan</title>
<style>
:root{--bg:#F7F6F2;--panel:#FFFFFF;--ink:#1C1B18;--muted:#5F5C55;--line:#E3E1DA;--chip:#ECEAE3;--accent:#2C55C9;--badge-bg:#EEF1FA;--badge-fg:#2A3F7A;--run:#2E8B57}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--chip);padding:1px 5px;border-radius:4px}
button{font:inherit;cursor:pointer}
.app{display:flex;height:100vh}
nav{flex:0 0 220px;padding:20px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
nav a{display:block;padding:8px;border-radius:6px;color:#3A3833;text-decoration:none}
nav a.on{background:var(--chip);color:var(--ink);font-weight:500}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:16px 32px;border-bottom:1px solid var(--line);min-height:61px}
header h1{margin:0;font-size:16px}
.log{flex:1;overflow-y:auto;padding:28px 32px;display:flex;flex-direction:column;gap:24px;max-width:820px}
.you{align-self:flex-end;max-width:520px;background:var(--chip);border-radius:10px;padding:10px 14px}
.agent{display:flex;flex-direction:column;gap:10px}
.agent p{margin:0}
ol.items{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
ol.items li{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid #EEECE6}
ol.items li:last-child{border-bottom:0}
ol.items li.active{background:#F6F7FC;box-shadow:inset 3px 0 0 var(--accent)}
.n{flex:0 0 22px;font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--muted);padding-top:2px}
.body{flex:1;min-width:0}
.badge{flex:none;height:30px;padding:0 10px;border:0;border-radius:999px;background:var(--badge-bg);color:var(--badge-fg);font-size:13px;font-weight:500}
li.active .badge{background:var(--accent);color:#fff}
.composer{padding:16px 32px 24px;max-width:820px}
.box{display:flex;gap:10px;align-items:flex-end;border:1px solid #D6D3CA;border-radius:10px;background:#fff;padding:10px 10px 10px 14px}
.box textarea{flex:1;border:0;resize:none;font:inherit;background:transparent;outline:none}
.send{height:40px;padding:0 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:500}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--run);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}

/* The side panel: a rail when collapsed, the overview or one thread when open. */
.rail{flex:0 0 44px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:6px}
.rail button{width:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.rail button:hover{background:var(--chip);color:var(--ink)}
.rail .count{font-size:12px;font-weight:600}
aside{flex:0 0 420px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside header{padding:12px 12px 12px 20px;gap:8px}
aside h2{margin:0;font-size:15px}
.icon{width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:8px;font-size:18px;display:grid;place-items:center}
.icon:hover{background:var(--chip);color:var(--ink)}
.end{margin-left:auto}
.back{border:0;background:transparent;color:var(--accent);font-size:13px;padding:6px 8px;border-radius:6px;margin-left:-8px}
.back:hover{background:var(--badge-bg)}
.list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;flex-direction:column;gap:4px;text-align:left;border:0;background:transparent;border-radius:8px;padding:10px 12px}
.row:hover{background:#F6F5F1}
.row .top{display:flex;gap:8px;align-items:center}
.row .q{color:#3A3833;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.row .working{color:var(--run);display:inline-flex;gap:6px;align-items:center}
.empty{color:var(--muted);font-size:14px;margin:12px}
blockquote{margin:12px 20px 0;padding:10px 12px;border-radius:8px;background:#F3F1EB;font-size:14px;color:#3A3833}
.tlog{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.m{display:flex;flex-direction:column;gap:3px;font-size:14px}
.m.u{align-self:flex-end;max-width:85%;align-items:flex-end}
.m.u .t{background:var(--chip);border-radius:10px;padding:8px 12px}
.m .w{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.plan{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.plan .head{display:flex;justify-content:space-between;margin-bottom:6px}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.plan li{display:flex;gap:8px;align-items:baseline}
.plan .box2{flex:none;width:14px;height:14px;border:1.5px solid #B9B5AA;border-radius:4px;position:relative;top:2px}
.plan li.done{color:var(--muted);text-decoration:line-through}
.plan li.done .box2{background:var(--muted);border-color:var(--muted)}
.plan li.doing{font-weight:500}
.plan li.doing .box2{border-color:var(--run);box-shadow:inset 0 0 0 3px #fff;background:var(--run)}
.tcomp{padding:12px 20px 20px;border-top:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{position:fixed;left:236px;bottom:10px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <nav aria-label="Sessions">
    <div class="mono" style="font-size:13px;color:var(--ink);padding:0 8px 14px">gloss<span style="color:var(--accent)">.</span></div>
    <div class="label" style="padding:8px 8px 4px">Sessions</div>
    <a href="#" class="on">Order service review</a>
    <a href="#">Flaky checkout test</a>
  </nav>

  <main>
    <header><h1>Order service review</h1><span class="mono">Claude Code</span></header>
    <div class="log">
      <div class="you">Review the order service changes before I open the PR.</div>
      <article class="agent">
        <p>Here’s what I found in <code>services/orders</code>:</p>
        <ol class="items" id="items"></ol>
      </article>
    </div>
    <form class="composer" onsubmit="return false">
      <div class="box"><textarea rows="2" placeholder="Message the agent…" aria-label="Message the agent"></textarea><button type="button" class="send">Send</button></div>
    </form>
  </main>

  <div id="side"></div>
</div>
<p class="note">Try: the rail (or Ctrl+Shift+T), a row in the overview, “All threads”, a badge in the conversation, Esc.</p>

<script>
const now = Date.now(), min = 60e3;
const threads = [
  { id:1, label:'item 1', quote:'Cache invalidation races the write path: invalidate() runs before the transaction commits.', at: now - 42*min, msgs:[
    ['u','Can you show the exact interleaving?'],
    ['a','Writer: invalidate → reader: miss, loads old row, caches it → writer: commit.']]},
  { id:2, label:'item 2', quote:'N+1 query in GET /orders: each order loads its line items in a loop.', at: now - 1*min, running:true, msgs:[
    ['u','Batch it with an IN query.'],
    ['plan',[['Add loadLineItems(orderIds)','done'],['Use it in GET /orders','doing'],['Keep the per-order wrapper','todo'],['Run the order tests','todo']]],
    ['a','Added loadLineItems. Switching the endpoint over now…']]},
  { id:3, label:'selection', quote:'“tenantId is read at the bottom”', at: now - 3*60*min, msgs:[
    ['u','Would passing tenantId directly break the audit log?'],
    ['a','No, the audit log reads it from the request context, not UserCtx.']]}
];
let state = { open: true, thread: null };
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const ago = (t) => { const m = Math.round((now - t) / min); return m < 1 ? 'now' : m < 60 ? m + 'm ago' : Math.round(m/60) + 'h ago'; };
const replies = (t) => t.msgs.filter(m => m[0] !== 'plan').length;

function render(){
  const ol = document.getElementById('items'); ol.innerHTML = '';
  ['Cache invalidation races the write path','N+1 query in GET /orders','UserCtx threaded through six layers'].forEach((txt, i) => {
    const t = threads.find(x => x.label === 'item ' + (i+1));
    const li = el('li', state.open && t && state.thread === t.id ? 'active' : '');
    li.append(el('span','n',(i+1)+'.'), el('div','body',txt));
    if (t){ const b = el('button','badge', replies(t) + ' replies'); b.onclick = () => go({ open:true, thread:t.id }); li.append(b); }
    ol.append(li);
  });

  const side = document.getElementById('side'); side.innerHTML = '';
  const running = threads.some(t => t.running);
  if (!state.open){
    const rail = el('div','rail'); rail.style.height = '100%';
    const b = el('button'); b.title = 'Threads (Ctrl+Shift+T)'; b.setAttribute('aria-label','Show threads');
    b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
    b.append(el('span','count', String(threads.length)));
    if (running) b.append(el('span','dot'));
    b.onclick = () => go({ open:true, thread:null });
    rail.append(b); side.append(rail); return;
  }
  const aside = el('aside'); aside.style.height = '100%'; side.append(aside);
  const collapse = el('button','icon end','»'); collapse.title = 'Hide panel (Esc)'; collapse.setAttribute('aria-label','Hide panel');
  collapse.onclick = () => go({ open:false, thread:null });

  if (state.thread === null){
    const h = el('header'); h.append(el('h2',null,'Threads'), el('span','mono', String(threads.length)), collapse); aside.append(h);
    const list = el('div','list'); aside.append(list);
    if (!threads.length) list.append(el('p','empty','No threads yet. Reply to a list item or a selection in an agent message to start one.'));
    for (const t of [...threads].sort((a,b) => b.at - a.at)){
      const r = el('button','row'); r.onclick = () => go({ open:true, thread:t.id });
      const top = el('div','top'); top.append(el('span','mono',t.label)); r.append(top);
      r.append(el('span','q',t.quote));
      const meta = el('div','meta'); meta.append(el('span',null, replies(t) + (replies(t) === 1 ? ' reply' : ' replies')), el('span',null, ago(t.at)));
      if (t.running){ const w = el('span','working'); w.append(el('span','dot'), 'working'); meta.append(w); }
      r.append(meta); list.append(r);
    }
    return;
  }
  const t = threads.find(x => x.id === state.thread);
  const h = el('header');
  const back = el('button','back','← All threads'); back.onclick = () => go({ open:true, thread:null });
  h.append(back, el('span','mono',t.label));
  if (t.running){ const w = el('span','mono'); w.style.color = 'var(--run)'; w.textContent = 'working…'; h.append(w); }
  h.append(collapse); aside.append(h);
  aside.append(el('blockquote',null,t.quote));
  const log = el('div','tlog'); aside.append(log);
  for (const [w, x] of t.msgs){
    if (w === 'plan'){
      const p = el('div','plan'); const hd = el('div','head');
      hd.append(el('span','label','Plan'), el('span','mono', x.filter(e => e[1]==='done').length + ' of ' + x.length + ' done'));
      const ul = el('ul'); for (const [c, s] of x){ const li = el('li', s === 'done' ? 'done' : s === 'doing' ? 'doing' : ''); li.append(el('span','box2'), el('span',null,c)); ul.append(li); }
      p.append(hd, ul); log.append(p); continue;
    }
    const m = el('div','m ' + w); m.append(el('span','w', w === 'u' ? 'You' : 'Agent'), el('span','t', x)); log.append(m);
  }
  const f = el('form','tcomp'); f.onsubmit = () => false;
  f.innerHTML = '<div class="box" style="padding:8px 8px 8px 12px"><textarea rows="2" placeholder="Reply in thread…" aria-label="Reply in thread" style="font-size:14px"></textarea><button type="button" class="send">Send</button></div>';
  aside.append(f);
}
function go(s){ state = s; render(); }
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') go({ open:false, thread:null });
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 't'){ e.preventDefault(); go({ open:!state.open, thread:null }); }
});
render();
</script>
</body>
</html>
