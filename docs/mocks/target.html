/* ================= Page around the mock ================= */

/* ================= The window ================= */
.win { width: 1280px; height: 800px; display: grid; grid-template-rows: 40px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); border-radius: 8px; overflow: hidden; background: var(--frame); box-shadow: 0 30px 80px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.25); position: relative; }

.body { display: flex; min-height: 0; position: relative; }

.side { flex: 0 0 240px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }

.switch-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; border-radius: var(--r-md); background: linear-gradient(to bottom, var(--surface), var(--bg)); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 var(--edge), var(--lift-1); }

function row(key, cur, hov) {
  const r = ROWS[key]

  return `<div class="lrow${cur ? ' cur' : ''}${hov ? ' hov' : ''}${r.ext ? ' ext' : ''}"><span class="lead">${r.lead}</span><div style="min-width:0"><div class="tt">${r.tt}</div><div class="sub">${r.sub}</div></div><span class="trail">${trail}</span></div>`
}
function sidebar({ project = true, cur = 'cache', rows = ['cache', 'review', 'failed', 'evict', 'ext', 'ext2'], hov = null, settings = false } = {}) {
  if (!project) {
    return `<nav class="side">
      <div class="switcher"><div class="switch-btn"><div class="names"><b>No project</b><span class="p">Open a folder to start</span></div>${ic('chevron-down')}</div><button class="icon-btn" title="Hide sidebar (Ctrl+B)">${ic('panel-left')}</button></div>
      <span class="grow"></span>${foot(settings)}</nav>`
  }
  return `<nav class="side">
    <div class="switcher"><div class="switch-btn" title="C:\\Users\\you\\Desktop\\cachekit"><div class="names"><b>cachekit</b><span class="p">~\\Desktop</span></div>${ic('chevrons-up-down')}</div><button class="icon-btn" title="Hide sidebar">${ic('panel-left')}</button></div>

}

        <div class="rrow"><span class="dot" style="color:var(--faint)"></span><div><div>Stored undefined values count as misses</div><div class="meta"><span class="ln">L7–8</span><span>Nit</span><span>0 replies</span><span>1m</span></div></div></div>
      </aside></div>`
  },
]

// One split-diff row per entry: [oldNo, oldText, newNo, newText, kind]
function dl(rows) {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  return rows.map(([on, ot, nn, nt, kind]) => {
    if (kind === 'add') return `<div class="dl"><span class="n e"></span><span class="e"></span><span class="e"></span><span class="n ag">${nn}</span><span class="m a">+</span><span class="a">${esc(nt)}</span></div>`
    if (kind === 'chg') return `<div class="dl"><span class="n dg">${on}</span><span class="m d">−</span><span class="d">${esc(ot)}</span><span class="n ag">${nn}</span><span class="m a">+</span><span class="a">${esc(nt)}</span></div>`
    if (kind === 'mark') return `<div class="dl"><span class="n">${on}</span><span></span><span>${esc(ot)}</span><span class="n gm">${nn}</span><span></span><span>${esc(nt)}</span></div>`
    if (kind === 'sugg') return `<div class="dl"><span class="n e"></span><span class="e"></span><span class="e"></span><span class="n ag gm sugg">${nn}</span><span class="m a">+</span><span class="a">${esc(nt)}</span></div>`
    return `<div class="dl"><span class="n">${on}</span><span></span><span>${esc(ot)}</span><span class="n">${nn}</span><span></span><span>${esc(nt)}</span></div>`
  }).join('')
}

const root = document.documentElement
const win = document.getElementById('win')
const screenPick = document.getElementById('screenPick')
function show(id) {
  const s = SCREENS.find((x) => x.id === id) ?? SCREENS[0]
  win.innerHTML = `${titleBar()}<div class="body">${s.render()}</div>`
  document.getElementById('notes').innerHTML = s.notes
  for (const b of screenPick.children) b.setAttribute('aria-pressed', String(b.dataset.v === s.id))
  history.replaceState(null, '', `#${s.id}`)
}
screenPick.innerHTML = SCREENS.map((s) => `<button data-v="${s.id}">${s.name}</button>`).join('')
screenPick.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.v) })
const themePick = document.getElementById('themePick')
themePick.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  root.dataset.theme = b.dataset.v
  for (const x of themePick.children) x.setAttribute('aria-pressed', String(x === b))
})
show(location.hash.slice(1))
</script>
