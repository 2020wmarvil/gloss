<title>Gloss · Rewind and attachment studies</title>
<style>
@font-face{font-family:Inter;src:url('../../node_modules/@fontsource-variable/inter/files/inter-latin-opsz-normal.woff2') format('woff2');font-weight:100 900}
:root{color-scheme:dark;--bg:#141312;--surface:#1c1b19;--raised:#262522;--sunken:#0f0e0d;--ink:#efeee9;--muted:#a39f96;--line:#35322e;--hover:#ffffff08;--accent:#ff5c9e;--tint:#3a1a2c;--scrim:#080706b8;--shadow:0 24px 72px #0009;--edge:#ffffff0a;--frame:#0c0b0a;--green:#6cc070;--subtle:#d4d1c8}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}button,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{border:0;background:none}svg.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}svg.defs{position:absolute;width:0;height:0;overflow:hidden}kbd{font:11px Inter,system-ui;border:1px solid var(--line);border-radius:4px;min-width:21px;text-align:center;padding:2px 5px;display:inline-block;color:var(--subtle);background:var(--surface)}
.study{max-width:1200px;margin:0 auto;padding:30px 32px}.study-head{display:flex;align-items:start;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:24px;letter-spacing:-.04em;font-weight:600;margin:4px 0 18px}.study-controls{display:flex;gap:8px}.quiet{color:var(--muted);padding:7px 10px;border:1px solid var(--line);border-radius:7px}.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}.tabs a{font-size:13px;display:block;text-decoration:none;color:var(--muted);padding:8px 13px;border-radius:7px}.tabs a.active{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.app-window{border:1px solid var(--line);border-radius:13px;background:var(--frame);height:740px;overflow:hidden;position:relative;box-shadow:0 1px 0 var(--edge) inset,0 12px 40px #0002}.titlebar{height:36px;background:var(--frame);padding:10px 16px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}.bead{display:inline-block;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 32% 20%,#fff9,transparent 44%),linear-gradient(135deg,#ff3da6,#ff9f3d);box-shadow:inset 0 0 0 1px #fff3,0 1px 3px #0003}.titlebar .bead{width:11px;height:11px}.shell{display:grid;grid-template-columns:170px minmax(0,1fr);height:calc(100% - 36px)}.sidebar{padding:12px 10px;color:var(--muted);display:flex;flex-direction:column;gap:6px;font-size:12px}.brand{display:flex;align-items:center;gap:8px;font-size:18px;color:var(--ink);letter-spacing:-.03em;font-weight:600;padding:1px 6px 20px}.project{padding:0 8px 8px}.session{padding:9px 8px;border-radius:6px;line-height:1.4}.session.on{color:var(--ink);background:var(--hover)}.sidebar-foot{margin-top:auto;padding:12px 8px}.workspace{overflow:hidden;background:var(--bg);border:1px solid var(--line);border-right:0;border-bottom:0;border-radius:11px 0 0 0;padding:24px 30px 18px;display:flex;flex-direction:column;min-width:0}.session-title{flex:none;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:25px}.chat{flex:1;min-height:0;overflow:auto;max-width:720px;margin:0 auto;width:100%}.speaker{color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.09em;margin-bottom:7px}.chat p{margin:0 0 15px;font-size:15px;line-height:1.7;color:var(--subtle)}.chat p strong{color:var(--ink);font-weight:500}.your-message{border-left:2px solid var(--line);padding-left:16px;margin-bottom:24px}.composer-area{flex:none;margin-top:0;padding-top:14px}.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-bottom:10px}.dot{height:6px;width:6px;background:var(--green);border-radius:50%}.composer{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:inset 0 1px 0 var(--edge),0 3px 10px #0001;overflow:hidden}.prompt{display:block;width:100%;min-height:72px;resize:none;background:none;border:0;outline:0;color:var(--ink);padding:16px 18px 9px;line-height:1.6}.composer-bottom{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}.tools{display:flex;gap:12px;align-items:center;color:var(--muted)}.send{background:linear-gradient(120deg,#ff3da6,#ff9f3d);color:#17040e;border-radius:7px;display:grid;place-items:center;width:30px;height:30px}.send .icon{width:17px}.statusline{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px;color:var(--muted);font-size:11px}.study-caption{display:flex;gap:30px;justify-content:space-between;margin-top:17px;align-items:start}.study-caption h2{font-size:14px;font-weight:500;margin:0 0 5px}.study-caption p{color:var(--muted);font-size:12px;margin:0;max-width:630px}.variant-badge{font-size:11px;white-space:nowrap;border:1px solid var(--line);border-radius:30px;padding:4px 10px;color:var(--muted)}
/* Rewind: the choices are the primary content, with a quiet keyboard footer. */
.rewind-scrim{position:absolute;inset:36px 0 0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}.rewind{width:550px;max-width:100%;background:var(--raised);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.rewind-head{padding:20px 22px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start;gap:20px}.rewind-head h2{font-size:17px;font-weight:550;letter-spacing:-.025em;margin:0 0 4px}.rewind-head p{font-size:12px;color:var(--muted);margin:0}.close{padding:0;color:var(--muted)}.rewind-list{scrollbar-width:thin;scrollbar-color:var(--line) transparent;list-style:none;padding:7px;margin:0;max-height:334px;overflow:auto}.rewind-list li{padding:12px 13px;cursor:pointer;border-radius:8px;position:relative;border:1px solid transparent}.rewind-list li+li{margin-top:3px}.rewind-list li.selected{background:color-mix(in srgb,var(--accent) 8%,var(--raised));border-color:color-mix(in srgb,var(--accent) 24%,transparent)}.rewind-list li.selected:before{position:absolute;content:'';width:2px;left:-1px;top:13px;bottom:13px;border-radius:2px;background:var(--accent)}.row-top{display:flex;align-items:center;justify-content:space-between;gap:16px}.row-title{font-size:13px;line-height:1.55;max-width:390px}.row-go{color:var(--accent);opacity:0}.selected .row-go{opacity:1}.row-meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:12px}.rewind-bottom{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:11px}.keygroup{display:flex;gap:5px;align-items:center}.keygroup span{margin-left:3px}.files-note{display:flex;align-items:center;gap:6px}.files-note .icon{width:13px;height:13px}.confirm-body{padding:20px 22px 23px;min-height:270px}.selected-prompt{font-size:14px;line-height:1.7;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:16px;margin-bottom:20px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}.summary-grid strong{font-size:14px;font-weight:500;display:block}.summary-grid span{font-size:11px;color:var(--muted)}.confirm-note{font-size:12px;color:var(--muted)}.prototype-notice{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;color:var(--muted);font-size:10px}
/* Both attachment options put context after the prompt. Image actions have their own space. */
.attached-label{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:2px 18px 9px}.attachment-content{padding:0 16px}.image-shelf{display:flex;gap:10px;align-items:start;overflow:auto;padding-bottom:3px}.image-card{width:246px;flex:0 0 auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunken)}.image-frame{padding:8px;display:flex;align-items:center;justify-content:center;min-height:90px}.image-frame img{display:block;max-width:100%;max-height:170px;width:auto;height:auto}.image-frame{cursor:zoom-in}.image-card.portrait{width:176px}.image-card.portrait .image-frame{padding:8px 18px}.image-caption{background:var(--surface);border-top:1px solid var(--line);padding:9px 10px 7px}.image-name{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.image-actions{display:flex;justify-content:space-between;align-items:center;padding:3px 5px 5px;background:var(--surface);gap:8px}.edit{padding:5px;display:flex;align-items:center;gap:5px;border-radius:5px;font-size:11px;color:var(--subtle);font-weight:500}.edit:hover,.remove:hover{background:var(--hover);color:var(--ink)}.edit .icon{width:13px;height:13px}.remove{width:28px;height:28px;padding:0;display:grid;place-items:center;border-radius:5px;color:var(--muted);flex:none}.remove .icon{width:14px;height:14px}.file-row{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 2px}.file{display:flex;align-items:center;gap:7px;padding:3px 3px 3px 9px;border:1px solid var(--line);border-radius:7px;font-size:11px;color:var(--subtle)}.file>.icon{color:var(--muted);width:13px;height:13px}.file .remove{width:23px;height:23px}.file-meta{color:var(--muted);font-size:10px;margin-left:3px}.compact-strip{display:flex;gap:10px;overflow:auto;padding-bottom:4px}.compact-image{display:flex;align-items:center;gap:10px;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:7px;flex:0 0 auto;width:260px}.compact-thumb{display:flex;align-items:center;justify-content:center;width:94px;height:74px;flex:none;cursor:zoom-in}.compact-thumb img{display:block;max-width:100%;max-height:100%;height:auto;width:auto}.compact-details{min-width:0;flex:1}.compact-details .image-actions{padding:6px 0 0;background:transparent;gap:2px}.compact-details .edit{padding:4px 0}.strip-note{font-size:10px;color:var(--muted);margin-top:4px}.lightbox{position:fixed;inset:0;z-index:10;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:40px;backdrop-filter:blur(6px)}.lightbox figure{margin:0;background:var(--raised);padding:18px;border:1px solid var(--line);border-radius:12px;max-width:95vw}.lightbox img{display:block;max-width:85vw;max-height:70vh}.lightbox figcaption{display:flex;align-items:center;justify-content:space-between;padding-top:13px;font-size:12px;color:var(--muted)}
@media(max-width:800px){.study{padding:18px}.sidebar{display:none}.shell{grid-template-columns:1fr}.workspace{padding:20px 18px}.study-head{align-items:center}.study-head h1{font-size:20px}.study-caption{gap:12px}.app-window{height:720px}.tabs a{padding:7px 9px;font-size:12px}.statusline{gap:9px}.rewind-bottom{flex-wrap:wrap}.chat p{font-size:14px}}
</style>
</head>
<body>
<svg class="defs" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="x" viewBox="0 0 24 24"><path d="m7 7 10 10M7 17 17 7"/></symbol>
<symbol id="pen" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l5-1L20 8a3 3 0 0 0-4-4L5 15Z"/></symbol>
<symbol id="file" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8Zm0 0v6h5M8 13h8M8 17h6"/></symbol>
<symbol id="paperclip" viewBox="0 0 24 24"><path d="m9 15 7-7a2 2 0 0 0-3-3L5 13a5 5 0 0 0 7 7l8-8a7 7 0 0 0-10-10L3 9"/></symbol>
<symbol id="up" viewBox="0 0 24 24"><path d="m6 11 6-6 6 6M12 5v14"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="M4 10h10a6 6 0 0 1 0 12M4 10l5-5M4 10l5 5"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
</defs></svg>
<main class="study">
  <header class="study-head"><div><div class="eyebrow">Gloss / UX studies / October 2026</div><h1>A quieter composer.</h1></div><div class="study-controls"><button class="quiet" id="replay">Reset demo</button><button class="quiet" id="theme">Light theme</button></div></header>
  <nav class="tabs" aria-label="Design options"><a href="#rewind" data-tab="rewind">Rewind</a><a href="#shelf" data-tab="shelf">A · Image cards</a><a href="#strip" data-tab="strip">B · Compact strip</a></nav>
  <div class="app-window" id="window">
    <div class="titlebar"><span class="bead"></span> Gloss</div>
    <div class="shell"><aside class="sidebar"><div class="brand"><span class="bead"></span> gloss</div><div class="project">⌄ &nbsp; gloss</div><div class="session on">Composer improvements</div><div class="session">Inline images</div><div class="session">Review #46</div><div class="sidebar-foot">6.1 Sol &nbsp; · &nbsp; Medium</div></aside><section class="workspace" id="workspace"></section></div>
    <div id="overlay"></div>
  </div>
  <div class="study-caption"><div><h2 id="caption-title"></h2><p id="caption"></p></div><span class="variant-badge">Interactive mock · not live UI</span></div>
</main>
<div id="lightbox"></div>
<script>
const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#${name}"/></svg>`;
const wide='composer-review/sample-wide.svg',tall='composer-review/sample-tall.svg';
let view=location.hash.slice(1)||'rewind',selected=1,confirming=false,opened=true;
const messages=[
  {text:'Can we make command mode look like a code block?',time:'12:42',after:'2 messages later'},
  {text:'Move the attachments below the message. Keep the screenshot proportions intact.',time:'12:34',after:'7 messages later'},
  {text:'The editor should return my prompt when I close the file.',time:'12:22',after:'11 messages later'},
  {text:'Make shell commands fire and forget.',time:'12:10',after:'16 messages later'},
  {text:'Add file references to the composer.',time:'11:48',after:'23 messages later'}
];
function bottom(){return `<div class="composer-bottom"><div class="tools">${icon('paperclip')}</div><button class="send" aria-label="Send prompt">${icon('up')}</button></div>`}
function files(){return `<div class="file-row"><div class="file attachment-item">${icon('file')}<span>composer-notes.md</span><span class="file-meta">4 KB</span><button class="remove" data-remove aria-label="Remove composer-notes.md">${icon('x')}</button></div></div>`}
function card(src,name,portrait=false){return `<div class="image-card attachment-item ${portrait?'portrait':''}"><div class="image-frame" data-preview="${src}" data-name="${name}"><img src="${src}" alt="${portrait?'Tall mobile screenshot':'Wide desktop screenshot'}"></div><div class="image-caption"><div class="image-name">${name}</div></div><div class="image-actions"><button class="edit" data-preview="${src}" data-name="${name}">${icon('pen')} Annotate</button><button class="remove" data-remove aria-label="Remove ${name}">${icon('x')}</button></div></div>`}
function compact(src,name){return `<div class="compact-image attachment-item"><div class="compact-thumb" data-preview="${src}" data-name="${name}"><img src="${src}" alt="Screenshot shown at its original aspect ratio"></div><div class="compact-details"><div class="image-name">${name}</div><div class="strip-note">Screenshot</div><div class="image-actions"><button class="edit" data-preview="${src}" data-name="${name}">${icon('pen')} Annotate</button><button class="remove" data-remove aria-label="Remove ${name}">${icon('x')}</button></div></div></div>`}
function render(){
 if(!['rewind','shelf','strip'].includes(view))view='rewind';
 document.querySelectorAll('[data-tab]').forEach(a=>{a.classList.toggle('active',a.dataset.tab===view);a.setAttribute('aria-current',a.dataset.tab===view?'page':'false')});
 const attachment=view==='rewind'?'':`<div class="attached-label">Attachments</div><div class="attachment-content">${view==='shelf'?`<div class="image-shelf">${card(wide,'desktop-capture.png')}${card(tall,'mobile-capture.png',true)}</div>`:`<div class="compact-strip">${compact(wide,'desktop-capture.png')}${compact(tall,'mobile-capture.png')}</div>`}${files()}</div>`;
 document.querySelector('#workspace').innerHTML=`<div class="session-title">Composer improvements</div><div class="chat"><div class="your-message"><div class="speaker">YOU</div><p>Can we tidy up images and files in the composer?</p></div><div class="speaker">GLOSS</div><p><strong>The message should come first.</strong> Attached context can follow it, with the complete image visible and controls that have their own space.</p></div><div class="composer-area"><div class="status"><span class="dot"></span>Done in main conversation</div><div class="composer"><textarea class="prompt" aria-label="Prompt">${view==='rewind'?'':'Please review these screenshots. Keep both image proportions, and move the controls away from the preview.'}</textarea>${attachment}${bottom()}</div><div class="statusline"><span>Context ▰ 39%</span><span>6.1 Sol ⌄</span><span>Medium ⌄</span><span>Full access ⌄</span></div></div>`;
 document.querySelector('.chat').scrollTop=document.querySelector('.chat').scrollHeight;
 const notes={rewind:['Rewind, with room to read.','A focused list of your messages, with timestamps and a quiet selection marker. The next step previews exactly what will be removed. Arrow keys, Enter and Escape work in this mock.'],shelf:['A · Image cards below the message','Larger, uncropped previews. File names and readable actions live below each image, never over it. Files follow the image shelf. Click a preview to see it at full size.'],strip:['B · Compact strip below the message','A shorter composer: previews keep their aspect ratios, with names and actions alongside. Files sit in their own row below. This saves space, with smaller image previews.']};
 document.querySelector('#caption-title').textContent=notes[view][0];document.querySelector('#caption').textContent=notes[view][1];
 drawOverlay();
 document.querySelectorAll('[data-preview]').forEach(el=>el.onclick=()=>preview(el.dataset.preview,el.dataset.name));
 document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>el.closest('.attachment-item').remove());
}
function drawOverlay(){
 const root=document.querySelector('#overlay');
 if(view!=='rewind'||!opened){root.innerHTML='';return}
 root.innerHTML=`<div class="rewind-scrim"><section class="rewind" role="dialog" aria-modal="true" aria-label="Rewind conversation"><header class="rewind-head"><div><h2>${confirming?'Return to before this message?':'Rewind conversation'}</h2><p>Composer improvements · Current session</p></div><button class="close" aria-label="Close rewind"><kbd>Esc</kbd></button></header>${confirming?`<div class="confirm-body"><div class="selected-prompt">${messages[selected].text}</div><div class="summary-grid"><div><strong>Earlier conversation</strong><span>Kept as context</span></div><div><strong>This message and later replies</strong><span>Removed from this session</span></div></div><div class="confirm-note">Your project files stay exactly as they are. The agent continues from the retained conversation.</div></div>`:`<ul class="rewind-list" role="listbox" aria-label="Your messages">${messages.map((m,i)=>`<li role="option" aria-selected="${selected===i}" class="${selected===i?'selected':''}" data-index="${i}"><div class="row-top"><div class="row-title">${m.text}</div><span class="row-go">${icon('chevron')}</span></div><div class="row-meta"><span>${m.time}</span><span>${m.after}</span></div></li>`).join('')}</ul>`}<footer class="rewind-bottom"><div class="keygroup">${confirming?`<kbd>Enter</kbd><span>Rewind</span> &nbsp; <kbd>Esc</kbd><span>Back</span>`:`<kbd>↑</kbd><kbd>↓</kbd><span>Browse</span> &nbsp; <kbd>Enter</kbd><span>Choose</span>`}</div><div class="files-note">${icon('check')} Files stay unchanged</div></footer></section></div>`;
 root.querySelector('.close').onclick=()=>{if(confirming)confirming=false;else opened=false;drawOverlay()};
 root.querySelectorAll('[data-index]').forEach(el=>{el.onmousemove=()=>{if(selected!==Number(el.dataset.index)){selected=Number(el.dataset.index);drawOverlay()}};el.onclick=()=>{selected=Number(el.dataset.index);confirming=true;drawOverlay()}});
}
function preview(src,name){const root=document.querySelector('#lightbox');root.innerHTML=`<div class="lightbox" role="dialog" aria-label="Image preview"><figure><img src="${src}" alt="${name}"><figcaption><span>${name}</span><button class="quiet" id="close-preview">Close <kbd>Esc</kbd></button></figcaption></figure></div>`;root.querySelector('#close-preview').onclick=()=>root.innerHTML='';root.querySelector('.lightbox').onclick=e=>{if(e.target.classList.contains('lightbox'))root.innerHTML=''}}
window.addEventListener('hashchange',()=>{view=location.hash.slice(1);confirming=false;opened=true;render()});
document.querySelector('#replay').onclick=()=>{opened=true;confirming=false;selected=1;render()};
function theme(name){document.documentElement.dataset.theme=name;document.querySelector('#theme').textContent=name==='dark'?'Light theme':'Dark theme'}
document.querySelector('#theme').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
document.addEventListener('keydown',e=>{
 if(document.querySelector('.lightbox')){if(e.key==='Escape')document.querySelector('#lightbox').innerHTML='';return}
 if(view!=='rewind'||!opened)return;
 if(['ArrowDown','ArrowUp','Enter','Escape'].includes(e.key))e.preventDefault();
 if(e.key==='Escape'){if(confirming)confirming=false;else opened=false}
 if(!confirming&&(e.key==='ArrowDown'||e.key==='ArrowUp'))selected=Math.max(0,Math.min(messages.length-1,selected+(e.key==='ArrowDown'?1:-1)));
 if(e.key==='Enter'){if(confirming){opened=false;document.querySelector('.prompt').value=messages[selected].text}else confirming=true}
 drawOverlay();document.querySelector('.rewind-list .selected')?.scrollIntoView({block:'nearest'});
});
theme(new URLSearchParams(location.search).get('theme')==='light'?'light':'dark');render();
</script>
</body>
</html>
